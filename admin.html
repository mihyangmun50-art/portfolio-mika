<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>관리자 | 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 관리자 화면에만 쓰는 모양 ===== */
    .sheet.pad { padding: 40px 48px; }
    .narrow { max-width: 480px; }

    .admin-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .admin-top .big-title { margin: 0; }
    .admin-top .who { color: var(--muted); font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .field { display: block; margin-bottom: 16px; }
    .field > span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .field small { color: var(--muted); font-weight: 400; }
    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"],
    .field input[type="number"],
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      background: #fff;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus,
    .field textarea:focus { outline: none; border-color: var(--blue); }
    .field input[readonly] { background: var(--tag); color: var(--muted); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    .btn {
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.danger:hover { border-color: #e11d48; color: #e11d48; }
    .btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; }

    .msg { min-height: 1.6em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    .msg.error { color: #e11d48; }
    .msg.ok { color: #16a34a; }

    .subtitle { margin: 0 0 16px; font-size: 18px; }

    .photo-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
    .photo.small { width: 110px; height: 120px; margin: 0; border-radius: 18px; flex: none; }
    .photo-row > div { min-width: 0; }
    input[type="file"] { max-width: 100%; }

    /* 카드 목록 */
    .admin-cards { list-style: none; margin: 0 0 24px; padding: 0; }
    .admin-card {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      margin-bottom: 12px;
    }
    .admin-card .thumb { margin: 0; }
    .admin-card .card-title { margin: 2px 0; }
    .admin-card .likes-count { color: #f43f5e; font-size: 13px; font-weight: 700; }
    .admin-card .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 260px; }

    .editor {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fafbfc;
    }
    .file-box {
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .file-box .current { margin: 8px 0 0; font-size: 13px; color: var(--muted); word-break: break-all; }

    .gb-list .gb-head { align-items: center; }

    @media (max-width: 760px) {
      .sheet.pad { padding: 28px 20px; }
      .grid-2 { grid-template-columns: 1fr; }
      .admin-card { grid-template-columns: 1fr; }
      .admin-card .actions { justify-content: flex-start; max-width: none; }
    }
  </style>
</head>
<body>
  <!-- 맨 위: 제목, 로그인한 사람, 로그아웃 -->
  <header class="sheet pad admin-top">
    <h1 class="big-title">ADMIN</h1>
    <div class="row">
      <span class="who" id="who"></span>
      <a class="btn small" href="index.html">방문자 화면 보기</a>
      <button type="button" class="btn small" id="logout-btn" hidden>로그아웃</button>
    </div>
  </header>

  <!-- 로그인 -->
  <section class="sheet pad" id="login-view" hidden>
    <div class="narrow">
      <h2 class="subtitle">관리자 로그인</h2>
      <label class="field">
        <span>이메일</span>
        <input type="email" id="login-email" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" id="login-password" autocomplete="current-password">
      </label>
      <button type="button" class="btn primary" id="login-btn">로그인</button>
      <p class="msg" id="login-msg" role="status"></p>
    </div>
  </section>

  <!-- 관리자가 아닐 때 -->
  <section class="sheet pad" id="denied-view" hidden>
    <h2 class="subtitle">관리자만 쓸 수 있어요</h2>
    <p class="intro">이 계정은 관리자 명단(admins)에 없어요. 로그아웃하고 관리자 계정으로 다시 로그인해 주세요.</p>
  </section>

  <!-- 관리자 화면 -->
  <div id="admin-view" hidden>
    <!-- 프로필 -->
    <section class="sheet pad">
      <h2 class="big-title">PROFILE</h2>

      <div class="photo-row">
        <div class="photo small" id="p-photo-preview"></div>
        <div>
          <label class="field">
            <span>프로필 사진 <small>(이미지, 10MB까지)</small></span>
            <input type="file" id="p-photo-file" accept="image/png,image/jpeg,image/webp,image/gif">
          </label>
          <button type="button" class="btn small danger" id="p-photo-clear">사진 빼기</button>
        </div>
      </div>
      <label class="field">
        <span>사진 주소 <small>(사진을 고르면 자동으로 채워져요)</small></span>
        <input type="text" id="p-photo_url" readonly>
      </label>

      <div class="grid-2">
        <label class="field"><span>이름</span><input type="text" id="p-name"></label>
        <label class="field"><span>직함</span><input type="text" id="p-title"></label>
        <label class="field"><span>경력 배지</span><input type="text" id="p-career_badge"></label>
        <label class="field"><span>이메일</span><input type="text" id="p-email"></label>
        <label class="field"><span>연락처</span><input type="text" id="p-phone"></label>
        <label class="field"><span>위치</span><input type="text" id="p-location"></label>
      </div>
      <label class="field">
        <span>한 줄 소개 제목 <small>(이름이 들어가면 그 부분에 파란 밑줄)</small></span>
        <input type="text" id="p-headline">
      </label>
      <label class="field"><span>소개 글</span><textarea id="p-intro"></textarea></label>
      <div class="grid-2">
        <label class="field"><span>EDUCATION</span><textarea id="p-education"></textarea></label>
        <label class="field"><span>SKILLS &amp; TOOLS</span><textarea id="p-skills"></textarea></label>
        <label class="field"><span>EXPERIENCE</span><textarea id="p-experience"></textarea></label>
        <label class="field"><span>맨 아래 인용</span><textarea id="p-quote"></textarea></label>
      </div>

      <button type="button" class="btn primary" id="p-save">프로필 저장</button>
      <p class="msg" id="p-msg" role="status"></p>
    </section>

    <!-- 포트폴리오 카드 -->
    <section class="sheet pad">
      <div class="admin-top">
        <h2 class="big-title">PORTFOLIO CARDS</h2>
        <button type="button" class="btn primary" id="c-new">+ 카드 추가</button>
      </div>
      <p class="msg" id="c-list-msg" role="status"></p>
      <ul class="admin-cards" id="c-list"></ul>

      <!-- 카드 추가·수정 폼 -->
      <div class="editor" id="c-editor" hidden>
        <h3 class="subtitle" id="c-editor-title">카드 추가</h3>
        <div class="grid-2">
          <label class="field"><span>번호 <small>(예: 01)</small></span><input type="text" id="c-number"></label>
          <label class="field"><span>분류</span><input type="text" id="c-category"></label>
        </div>
        <label class="field"><span>제목 <small>(꼭 적어야 해요)</small></span><input type="text" id="c-title"></label>
        <label class="field"><span>설명</span><textarea id="c-description"></textarea></label>
        <label class="field"><span>태그 <small>(쉼표로 나눠 적기. 예: 총괄 PM, UI/UX)</small></span><input type="text" id="c-tags"></label>

        <div class="grid-2">
          <div class="field">
            <span>썸네일 이미지 <small>(이미지, 10MB까지)</small></span>
            <div class="file-box">
              <input type="file" id="c-thumb-file" accept="image/png,image/jpeg,image/webp,image/gif">
              <p class="current" id="c-thumb-current"></p>
              <button type="button" class="btn small danger" id="c-thumb-clear">썸네일 빼기</button>
            </div>
          </div>
          <div class="field">
            <span>첨부 파일 <small>(이미지 또는 PDF, 10MB까지)</small></span>
            <div class="file-box">
              <input type="file" id="c-file-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <p class="current" id="c-file-current"></p>
              <button type="button" class="btn small danger" id="c-file-clear">첨부 파일 빼기</button>
            </div>
          </div>
        </div>

        <div class="row">
          <button type="button" class="btn primary" id="c-save">저장</button>
          <button type="button" class="btn" id="c-cancel">취소</button>
        </div>
        <p class="msg" id="c-msg" role="status"></p>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet pad">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="msg" id="g-msg" role="status"></p>
      <ul class="gb-list" id="g-list"></ul>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
