<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 큰 흰 카드: 왼쪽 ABOUT ME, 오른쪽 PORTFOLIO -->
  <main class="sheet">
    <aside class="about">
      <h2 class="section-label">ABOUT ME</h2>

      <div class="photo" id="profile-photo"></div>

      <h1 class="name" id="profile-name">&nbsp;</h1>
      <p class="title" id="profile-title"></p>
      <p class="badge" id="profile-badge" hidden></p>

      <ul class="contacts">
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          </span>
          <span><small>이름</small><span id="contact-name"></span></span>
        </li>
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </span>
          <span><small>이메일</small><a id="contact-email"></a></span>
        </li>
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
          </span>
          <span><small>연락처</small><a id="contact-phone"></a></span>
        </li>
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </span>
          <span><small>위치</small><span id="contact-location"></span></span>
        </li>
      </ul>
    </aside>

    <section class="content">
      <h2 class="big-title">PORTFOLIO</h2>

      <p class="headline" id="profile-headline"></p>
      <p class="intro" id="profile-intro"></p>

      <div class="info-grid">
        <div class="info">
          <h3>
            <span class="info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
            </span>
            EDUCATION
          </h3>
          <p id="profile-education"></p>
        </div>
        <div class="info">
          <h3>
            <span class="info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
            </span>
            SKILLS &amp; TOOLS
          </h3>
          <p id="profile-skills"></p>
        </div>
        <div class="info">
          <h3>
            <span class="info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></svg>
            </span>
            EXPERIENCE
          </h3>
          <p id="profile-experience"></p>
        </div>
      </div>

      <div class="highlights">
        <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
        <div class="cards" id="cards">
          <p class="empty">불러오는 중…</p>
        </div>
      </div>

      <blockquote class="quote" id="profile-quote"></blockquote>
    </section>
  </main>

  <!-- 방명록 -->
  <section class="sheet guestbook">
    <h2 class="big-title">GUESTBOOK</h2>

    <form class="gb-form" id="gb-form">
      <input type="text" id="gb-nickname" placeholder="별명 (20자까지)" maxlength="20" required>
      <input type="text" id="gb-message" placeholder="한마디 남겨 주세요 (200자까지)" maxlength="200" required>
      <button type="button" id="gb-submit">남기기</button>
    </form>
    <p class="gb-status" id="gb-status" role="status"></p>

    <ul class="gb-list" id="gb-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
